# Enable the UART driver
CONFIG_UART_ASYNC_API=y
CONFIG_NRFX_UARTE0=y
CONFIG_SERIAL=y

CONFIG_GPIO=y

# Make sure printk is printing to the RTT console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y

CONFIG_EVENTS=y
CONFIG_RING_BUFFER=y
CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Optimus"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
# CONFIG_BT_L2CAP_TX_BUF_COUNT=2
# CONFIG_BT_L2CAP_TX_FRAG_COUNT=0
# CONFIG_BT_BUF_ACL_TX_COUNT=1
# CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=15000
# CONFIG_BT_LL_SOFTDEVICE=y
# CONFIG_BT_CTLR=y
# CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT_OVERRIDE=y
CONFIG_BT_RX_STACK_SIZE=4096

# Enable the NUS service
CONFIG_BT_NUS=y
CONFIG_BT_NUS_AUTHEN=n
# CONFIG_BT_ATT_LOG_LEVEL_DBG=y
# CONFIG_BT_GATT_LOG_LEVEL_DBG=y
CONFIG_BT_NUS_UART_BUFFER_SIZE=256
CONFIG_BT_NUS_SECURITY_ENABLED=n
CONFIG_BT_NUS_HOST_AUTH_ENABLED=n
CONFIG_BT_NUS_FPGA_OTA_ENABLED=y
# Security
# CONFIG_BT_SMP_SC_ONLY=y
# CONFIG_BT_MAX_PAIRED=5
# CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
# Debug
CONFIG_BT_NUS_IMP_MEA_MOCK_TEST=n
CONFIG_THREAD_NAME=n

# Enable bonding
# CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
# CONFIG_SETTINGS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y


# This example requires more stack
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Config logger
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_ASSERT=y

CONFIG_I2C=y
CONFIG_BQ274XX=n
CONFIG_SPI=y
CONFIG_SPI_ASYNC=y
CONFIG_SENSOR=y
CONFIG_ADC=y
CONFIG_WATCHDOG=y
CONFIG_FPU=y

# Enable MCUBoot and FOTA
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y

# Enable updates for the network core
CONFIG_NRF53_UPGRADE_NETWORK_CORE=y
CONFIG_UPDATEABLE_IMAGE_NUMBER=2
CONFIG_ADD_MCUBOOT_MEDIATE_SIM_FLASH_DTS=y

# Set Clock
CONFIG_SOC_HFXO_CAP_INTERNAL=y
CONFIG_SOC_HFXO_CAP_INT_VALUE_X2=20
CONFIG_SOC_SERIES_NRF53X=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_50PPM=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y
# RTC
CONFIG_COUNTER=y
# CONFIG_RTC=y
# CONFIG_RTC_ALARM=y
# CONFIG_RTC_UPDATE=y
# CONFIG_RTC_CALIBRATION=y

# proprietary work queue
CONFIG_EVENT_WORKQUEUE_STACK_SIZE=1024
CONFIG_EVENT_STACK_WARNING_THRESHOLD=512
CONFIG_EVENT_WORKQUEUE_PRIORITY=8
CONFIG_EVENT_WORKQUEUE_MONITOR=n
CONFIG_EVENT_MAX_LATENCY=200

# zbus config
CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_OBSERVER_NAME=y
CONFIG_ZBUS_RUNTIME_OBSERVERS=y